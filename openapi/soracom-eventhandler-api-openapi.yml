            - Variables can be used. For more details, refer to [Variables](/en/docs/air/event-handler/#variables).

            '
          type: string
        parameter1:
          description: 'Value of the parameter to pass to AWS Lambda.


            - Do not specify the same key repeatedly, such as specifying `parameter1` multiple times.

            - Variables can be used. For more details, refer to [Variables](/en/docs/air/event-handler/#variables).

            '
          type: string
        parameter2:
          description: 'Identical to `parameter1`.

            '
          type: string
        parameter3:
          description: 'Identical to `parameter1`.

            '
          type: string
        parameter4:
          description: 'Identical to `parameter1`.

            '
          type: string
        parameter5:
          description: 'Identical to `parameter1`.

            '
          type: string
        secretAccessKey:
          deprecated: true
          description: (Deprecated).
          type: string
        speedClass:
          description: "Speed class. Specify one of the following. However, specify a speed class according to the subscription.\n\n- For plan01s, plan01s - Low Data Volume, planX3 (X3-5MB), planP1, plan-D (without bundle), plan-D (D-300MB), plan-K2 (K2-300MB), plan-K:\n    - `s1.minimum`\n    - `s1.slow`\n    - `s1.standard`\n    - `s1.fast`\n    - `s1.4xfast`\n- For plan-US:\n    - `s1.minimum`\n    - `s1.slow`\n    - `s1.standard`\n    - `s1.fast`\n    - `s1.4xfast`\n    - `s1.8xfast`\n- For plan-DU:\n    - `u1.standard`\n    - `u1.slow`\n\n**Warning**: Speed class cannot be changed for plan-KM1 and Virtual SIM/Subscriber as they have only one speed class.\n"
          enum:
          - s1.minimum
          - s1.slow
          - s1.standard
          - s1.fast
          - s1.4xfast
          - s1.8xfast
          - u1.standard
          - u1.slow
          type: string
        title:
          description: 'Subject.


            - Variables can be used. For more details, refer to [Variables](/en/docs/air/event-handler/#variables).


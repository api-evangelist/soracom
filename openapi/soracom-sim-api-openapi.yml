      description: Retrieves the usage information of "testing" status of the IoT SIM. Data can only be retrieved while the IoT SIM is in "testing" status.
      operationId: getTestingUsage
      parameters:
      - description: SIM ID of the target IoT SIM.
        in: path
        name: sim_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestingUsage'
          description: Usage information of the IoT SIM in testing status.
        '404':
          description: No testing usage information found for the target IoT SIM.
      security:
      - api_key: []
        api_token: []
      summary: Get usage of IoT SIM in testing status
      tags:
      - Sim
      x-soracom-cli:
      - sims get-testing-usage
  /sims/{sim_id}/unset_expiry_time:
    post:
      description: Deletes expiry time of specified SIM and changes it to indefinite.
      operationId: unsetSimExpiryTime
      parameters:
      - description: SIM ID of the target SIM. The SIM ID can be obtained from the [Sim:listSims API](#/Sim/listSims).
        in: path
        name: sim_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Change of specified SIM's expiry time to indefinite complete.
        '404':
          description: The specified SIM does not exist or the SIM does not have an expiry time.
      security:
      - api_key: []
        api_token: []
      summary: Deletes expiry time of the SIM
      tags:
      - Sim
      x-soracom-cli:
      - sims unset-expiry-time
  /sims/{sim_id}/unset_group:
    post:
      description: Removes a SIM from a SIM group.
      operationId: unsetSimGroup
      parameters:
      - description: ID of the target SIM. The SIM ID can be obtained using the [Sim:listSims API](#/Sim/listSims).
        in: path
        name: sim_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sim'
          description: Detailed information of the updated SIM.
        '404':
          description: The specified SIM does not exist.
      security:
      - api_key: []
        api_token: []
      summary: Removes a SIM from a SIM group
      tags:
      - Sim
      x-soracom-cli:
      - sims unset-group
  /sims/{sim_id}/unset_imei_lock:
    post:
      description: Unsets the IMEI lock of the specified SIM.
      operationId: unsetSimImeiLock
      parameters:
      - description: SIM ID of the target SIM.
        in: path
        name: sim_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sim'
          description: The SIM's detailed information after the update.
        '404':
          description: No such SIM found.
      security:
      - api_key: []
        api_token: []
      summary: Unsets IMEI lock of SIM
      tags:
      - Sim
      x-soracom-cli:
      - sims unset-imei-lock
  /sims/{sim_id}/update_speed_class:
    post:
      description: Updates the IoT SIM speed class.
      operationId: updateSimSpeedClass
      parameters:
      - description: SIM ID of the target SIM.
        in: path
        name: sim_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpeedClassRequest'
        description: The speed class of the IoT SIM.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sim'
          description: The SIM's detailed information after the update.
        '400':
          description: The specified speed class does not exist to the subscription. For example, arc.standard cannot be specified for plan01s.
        '404':
          description: No such SIM found.
      security:
      - api_key: []
        api_token: []
      summary: Updates the IoT SIM speed class
      tags:
      - Sim
      x-soracom-cli:
      - sims update-speed-class
components:
  schemas:
    SmsForwardingRequest:
      properties:
        encodingType:
          default: 2
          description: "Encoding type of the message body. Default is `2` (`DCS_UCS2`).\n\n- `1`: Send in GSM 7-bit that only supports standard alphabet. Kanji, Cyrillic, and Arabic characters cannot be sent. Maximum 160 characters (maximum 140 bytes).\n\n    Example: `{\"encodingType\": 1, \"payload\": \"Test message.\"}`\n- `2`: Send in UCS-2, which supports Kanji, Cyrillic, Arabic, etc. Maximum 70 characters.\n\n    Example: `{\"encodingType\": 2, \"payload\": \"テストメッセージ\"}`\n"
          type: integer
        payload:
          type: string
      type: object
    APICallErrorMessage:
      properties:
        code:
          description: Error code.
          type: string
        message:
          description: Error message. You can select the output language for error messages by setting the language (en, ja) in the X-Soracom-Lang header at request time.
          type: string
      required:
      - code
      - message
      type: object
    ArcCredentialAttachRequest:
      properties:
        arcClientPeerPublicKey:
          description: If this parameter is missing, the server generates a keypair.
          type: string
      type: object
    SimDownlinkTcpConnectionFireAndForgetOptions:
      description: 'Establishes a TCP connection with the device and attempts to send specified data, then returns the API response.


        - Does not wait for data reception from the device.

        - Even if the device cannot be reached over the network or data transmission to the device is confirmed, this API will still return a successful response.

        '
      properties:
        type:
          enum:
          - fire_and_forget
          type: string
      type: object
    SimDownlinkTcpConnectionWaitAllOptions:
      description: 'Establishes a TCP connection with the device and sends the specified data, then waits for data reception from the device. Then, returns the data received during the time specified by `timeout` or until the device disconnects the TCP connection as the API response.


        - If no data is received from the device, after the time specified by `timeout` elapses, the TCP connection is terminated and an error is returned.

        '
      properties:
        type:
          enum:
          - wait_all
          type: string
      type: object
    Map:
      additionalProperties:
        type: string
      type: object
    SimDownlinkTcpConnectionWaitForPatternOptions:
      description: "Establishes a TCP connection with the device and sends the specified data, then waits for data reception from the device. Then, returns the data received until \"the byte pattern specified by `terminationPattern` is received\" as the API response.\n\n- In the following cases, an API response indicating an error is returned:\n    - If no data is received from the device.\n    \n        After the time specified by `timeout` elapses, the TCP connection is terminated and an error is returned.\n    - If data matching the pattern is not received within the time specified by `timeout`.\n"
      properties:
        terminationPattern:
          description: The sequence of bytes that ends data reception, encoded as a UTF-8 string in the format specified by `terminationPatternEncoding`.
          type: string
        terminationPatternEncoding:
          $ref: '#/components/schemas/SimDownlinkBinaryEncoding'
          description: The encoding method for the byte sequence that ends data reception. The default is `base64`.
        type:
          enum:
          - wait_for_pattern
          type: string
      required:
      - terminationPattern
      type: object
    SimDownlinkUdpRequest:
      properties:
        payload:
          description: 'Data to be sent, encoded as a string in the format specified by `payloadEncoding`. The maximum size is 1,472 bytes for the encoded string.


            **Warning**: Depending on the network path, the actual maximum size may be smaller. Data exceeding the maximum allowable size for the network path may be discarded.

            '
          type: string
        payloadEncoding:
          $ref: '#/components/schemas/SimDownlinkBinaryEncoding'
          description: 'Encoding format for the data to be sent. Specify one of the following. The default is `string`.

            - `string`: Treated as a UTF-8 string.

            - `base64`: Base64 encoding.

            - `hex`: Hexadecimal encoding. Case insensitive.

            '
        port:
          description: Port number for UDP.
          maximum: 65535
          minimum: 1
          type: integer
      required:
      - port
      - payload
      type: object
    PacketCaptureSessionRequest:
      properties:
        duration:
          format: int32
          maximum: 86400
          minimum: 30
          type: integer
        prefix:
          pattern: ^[0-9A-Za-z_\-]{0,100}$
          type: string
      required:
      - duration
      type: object
    ArcCredentialRenewResponse:
      properties:
        arcClientPeerPrivateKey:
          type: string
        arcClientPeerPublicKey:
          type: string
      type: object
    SimProfile:
      properties:
        arcClientPeerPrivateKey:
          description: 'The client''s PrivateKey (client peer private key) for connecting with WireGuard.

            - PrivateKey (client peer private key) cannot be redisplayed. If you have lost your private key, generate a new key and update the device credentials.

            - Never disclose connection information to outside parties.

            '
          type: string
        arcClientPeerPublicKey:
          type: string
        iccid:
          type: string
        otaSupported:
          type: boolean
        primaryImsi:
          type: string
        subscribers:
          additionalProperties:
            $ref: '#/components/schemas/SimplifiedSubscriber'
          type: object
      type: object
    SimDownlinkTcpResponse:
      description: Response for the TCP connection
      properties:
        data:
          description: Data received, encoded as a string in the format specified by dataEncoding. The maximum size is 5 MiB for the encoded string.
          type: string
        dataEncoding:
          $ref: '#/components/schemas/SimDownlinkBinaryEncoding'
          description: Encoding format for the received data.
      required:
      - data
      type: object
    ArcCredentialAttachResponse:
      properties:
        arcClientPeerPrivateKey:
          type: string
        arcClientPeerPublicKey:
          type: string
      type: object
    SimDownlinkTcpRequest:
      properties:
        connectionOptions:
          default:
            type: wait_all
          description: Options that specify the behavior of data reception during TCP connection (how the SORACOM API handles responses from the device). Choose one of the following.
          oneOf:
          - $ref: '#/components/schemas/SimDownlinkTcpConnectionFireAndForgetOptions'
          - $ref: '#/components/schemas/SimDownlinkTcpConnectionWaitFirstOptions'
          - $ref: '#/components/schemas/SimDownlinkTcpConnectionWaitAllOptions'
          - $ref: '#/components/schemas/SimDownlinkTcpConnectionWaitForPatternOptions'
          - $ref: '#/components/schemas/SimDownlinkTcpConnectionIdleTimeoutOptions'
        payload:
          description: Data to be sent, encoded as a string in the format specified by payloadEncoding. The maximum size is 5 MiB for the encoded string.
          type: string
        payloadEncoding:
          $ref: '#/components/schemas/SimDownlinkBinaryEncoding'
          description: 'Encoding format for the data to be sent. Specify one of the following. The default is `string`.


            - `string`: Treated as a UTF-8 string.

            - `base64`: Base64 encoding.

            - `hex`: Hexadecimal encoding. Case insensitive.

            '
        port:
          description: Port number for the TCP connection.
          maximum: 65535
          minimum: 1
          type: integer
        timeout:
          default: 30
          description: Timeout duration (seconds) for data transmission and reception. The default value is `30` and the maximum value is `300`.
          maximum: 300
          minimum: 1
          type: integer
      required:
      - port
      - payload
      type: object
    SimDownlinkTcpConnectionIdleTimeoutOptions:
      description: "Establishes a TCP connection with the device and sends the specified data, then waits for data reception from the device. After data reception begins, if no data is received for the time specified by `idleTimeout`, returns the data received up to that point as the API response.\n\n- In the following cases, an API response indicating an error is returned:\n    - If no data is received from the device.\n    \n        After the time specified by `timeout` elapses, the TCP connection is terminated and an error is returned.\n    - If the device disconnects the TCP connection before sending any data.\n"
      properties:
        idleTimeout:
          description: Time to wait (seconds) after receiving the last data from the device.
          type: integer
        type:
          enum:
          - idle_timeout
          type: string
      required:
      - idleTimeout
      type: object
    SimDownlinkSshPasswordAuthentication:
      description: 'Configuration for SSH connection using password authentication (`"type": "password"`). Specify either `password` or `passwordCredentialsId`.

        '
      properties:
        password:
          description: Password for the SSH connection. Ignored if `passwordCredentialsId` is specified.
          type: string
        passwordCredentialsId:
          description: 'Soracom credential set ID where the authentication credentials are registered.


            - **Type**: Select "Pre-Shared key".

            - **Pre-Shared Key**: Enter the password for the SSH connection.

            '
          type: string
        type:
          enum:
          - password
          type: string
      type: object
    SessionEvent:
      properties:
        apn:
          description: The Access Point Name configured.
          type: string
        cell:
          $ref: '#/components/schemas/Cell'
        createdTime:
          type: string
        dns0:
          description: First IP address of DNS servers.
          type: string
        dns1:
          description: Second IP address of DNS servers.
          type: string
        event:
          description: 'The type of session event. It is one of the following:


            - `Created`: The session has been established.

            - `Modified`: The session update (handover) was notified by the base station due to reasons such as device movement or changes in radio wave strength.

            - `Deleted`: The session has been disconnected.


            In the case of `Created` or `Modified`, it indicates that the session state is online. In the case of `Deleted`, it indicates that the session state is offline. For the meaning of a session, refer to [State (Online/Offline)](/en-us/resources/glossary/session/#state-online-offline).

            '
          type: string
        gatewayPrivateIpAddress:
          description: The private IP address of the VPG. In the case of VPG Type-F, the source IP address of the closed network communication from the IoT SIM to the customer's system is NAT-ed to this IP address.
          type: string
        gatewayPublicIpAddress:
          description: The fixed global IP address when using the VPG [Fixed Global IP Address Option](/en/docs/vpg/fixed-global-ip/).
          type: string
        imei:
          description: The IMEI of the device using the IoT SIM. If using a virtual SIM/subscriber, this will be `null`.
          type: string
        imsi:
          description: The IMSI of the IoT SIM.
          type: string
        operatorId:
          description: The operator ID of the session event.
          type: string
        sessionId:
          description: The session ID.
          type: string
        simId:
          type: string
        subscription:
          description: The subscription.
          type: string
        time:
          description: The timestamp of the session event.
          format: int64
          type: integer
        ueIpAddress:
          description: The IP address of the device.
          type: string
        vpgId:
          description: The VPG ID. If the VPG was not used, this will not be output.
          type: string
      type: object
    UpdateSpeedClassRequest:
      properties:
        speedClass:
          description: "Speed class. Specify one of the following. Please specify the speed class that matches the subscription.\n\n- For plan01s, plan01s - Low Data Volume, planX3 (X3-5MB), planP1, plan-D (without bundle), plan-D (D-300MB), plan-K2 (K2-300MB), plan-K:\n    - `s1.minimum`\n    - `s1.slow`\n    - `s1.standard`\n    - `s1.fast`\n    - `s1.4xfast`\n- For plan-US:\n    - `s1.minimum`\n    - `s1.slow`\n    - `s1.standard`\n    - `s1.fast`\n    - `s1.4xfast`\n    - `s1.8xfast`\n- For plan-DU:\n    - `u1.standard`\n    - `u1.slow`\n\n**Warning**: Speed class for plan-KM1 and virtual SIM/Subscriber cannot be changed as there is only one speed class available.\n"
          enum:
          - s1.minimum
          - s1.slow
          - s1.standard
          - s1.fast
          - s1.4xfast
          - s1.8xfast
          - u1.standard
          - u1.slow
          type: string
      required:
      - speedClass
      type: object
    LocationRegistrationStatus:
      properties:
        cs:
          $ref: '#/components/schemas/LocationRegistrationStatusForNetwork'
          description: Information on location registration to the CS network
        eps:
          $ref: '#/components/schemas/LocationRegistrationStatusForNetwork'
          description: Information on location registration to the EPS network
        ps:
          $ref: '#/components/schemas/LocationRegistrationStatusForNetwork'
          description: Information on location registration to the PS network
      type: object
    ArcSessionCreateResponse:
      properties:
        arcAllowedIPs:
          items:
            type: string
          type: array
        arcClientPeerIpAddress:
          type: string
        arcClientPeerPublicKey:
          type: string
        arcServerEndpoint:
          type: string
        arcServerPeerPublicKey:
          type: string
      type: object
    SimplifiedSubscriber:
      properties:
        bundles:
          items:
            type: string
          type: array
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        imsi:
          description: IMSI
          type: string
        msisdn:
          type: string
        status:
          description: 'Status of the IoT SIM (primary subscription of the IoT SIM) or status of the additional subscription.


            For primary subscriptions, it refers to the status of the IoT SIM.


            - `ready`

            - `active`

            - `inactive`

            - `standby`

            - `suspended`

            - `terminated`


            For additional subscriptions, it refers to the status of the additional subscription.


            - `shipped`: OTA is ready or in progress (first half).

            - `delivered`: OTA is in progress (second half).

            - `ready`: OTA is complete.

            - `active`: A connection via the additional subscription has been confirmed. This does not refer to the status of the IoT SIM.

            - `terminated`


            The status of the virtual SIM/subscriber is either `active` or `terminated`.

            '
          enum:
          - shipped
          - delivered
          - ready
          - active
          - terminated
          type: string
        subscription:
          type: string
      type: object
    ArcCredentialRenewRequest:
      properties:
        arcClientPeerPublicKey:
          description: Public key of the Arc client to be granted to the SIM. If this parameter is missing, the server generates a key pair.
          type: string
      type: object
    PreviousSessionStatus:
      description: Information about the previous session.
      properties:
        cell:
          $ref: '#/components/schemas/Cell'
        createdTime:
          description: The time when the previous session was created.
          format: int64
          type: integer
        deletedTime:
          description: The time when the previous session was deleted.
          format: int64
          type: integer
        dnsServers:
          description: Array of IP address of the DNS servers.
          items:
            type: string
          type: array
        gatewayPrivateIpAddress:
          description: The private IP address of the VPG. In the case of VPG Type-F, the source IP address of the closed network communication from the IoT SIM to the customer's system is NAT-ed to this IP address.
          type: string
        gatewayPublicIpAddress:
          description: The fixed global IP address when using the VPG [Fixed Global IP Address Option](/en/docs/vpg/fixed-global-ip/).
          type: string
        imei:
          description: The IMEI of the device using the IoT SIM. If using a virtual SIM/subscriber, this will be `null`.
          type: string
        imsi:
          description: The IMSI of the IoT SIM.
          type: string
        sessionId:
          description: The session ID.
          type: string
        subscription:
          type: string
        ueIpAddress:
          description: The IP address of the device.
          type: string
        vpgId:
          description: The VPG ID. If the VPG was not used, this will not be output.
          type: string
      type: object
    Sim:
      properties:
        activeProfileId:
          type: string
        arcSessionStatus:
          $ref: '#/components/schemas/ArcSessionStatus'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        createdTime:
          description: UNIX time (in milliseconds) that the IoT SIM (primary subscription to the IoT SIM) was created.
          format: int64
          type: integer
        expiryAction:
          description: 'Action when expiration date expires. Please refer to [Soracom Air Expiration Function](/en/docs/air/expiration/) for more detail.


            - `doNothing` : do nothing

            - `deleteSession` : delete session of the SIM if any

            - `deactivate` : change the SIM status to Inactive

            - `suspend` : change the SIM status to Suspended

            - `terminate` : forcibly end any existing connections, and terminate the SIM

            - `null`: No expiration date set.

            '
          enum:
          - doNothing
          - deleteSession
          - deactivate
          - suspend
          - terminate
          - (null value)
          type: string
        expiryTime:
          description: IoT SIM expiration date (UNIX time in milliseconds).
          format: int64
          type: integer
        groupId:
          description: The SIM group ID where the SIM belongs to.
          type: string
        imeiLock:
          $ref: '#/components/schemas/ImeiLock'
        lastModifiedTime:
          description: UNIX time (in milliseconds) that the information in the IoT SIM (primary subscription to the IoT SIM) was changed
          format: int64
          type: integer
        lastPortMappingCreatedTime:
          description: UNIX time in milliseconds that Napter was used with the SIM. If Napter has never been used with the SIM, null is returned.
          format: int64
          type: integer
        localInfo:
          $ref: '#/components/schemas/Map'
        moduleType:
          description: 'The form factor of the physical SIM.


            - `mini`: standard (2FF) size.

            - `micro`: micro (3FF) size.

            - `nano`: nano (4FF) size.

            - `trio`: 3 in 1 (can be cut into 2FF/3FF/4FF depending on how you cut it).

            - `embedded`: Embedded (MFF2).

            - `virtual`: Virtual SIM/Subscriber.

            - `integrated`: Embedded (iSIM).

            - `profilePackage`: Profile Package (eSIM profile).

            '
          enum:
          - mini
          - micro
          - nano
          - trio
          - embedded
          - virtual
          - integrated
          - profilePackage
          type: string
        operatorId:
          description: The ID of the operator who owns this SIM.
          type: string
        otaSerialNumber:
          type: string
        pcapEndTime:
          format: int64
          type: integer
        pcapStartTime:
          format: int64
          type: integer
        previousSession:
          $ref: '#/components/schemas/PreviousSessionStatus'
        profiles:
          additionalProperties:
            $ref: '#/components/schemas/SimProfile'
          type: object
        renewalFeeStatusSetTime:
          description: UNIX time (in milliseconds) that the IoT SIM status is either "ready", "standby", or "suspended".
          format: int64
          type: integer
        serialNumber:
          description: The serial number of the SIM. Virtual SIM/Subscriber does not have a serial number.
          type: string
        sessionStatus:
          $ref: '#/components/schemas/SessionStatus'
        simId:
          description: The SIM ID of the SIM.
          type: string
        speedClass:
          description: The speed class of the SIM.
          type: string
        status:
          description: 'Status of the IoT SIM (primary subscription of the IoT SIM). The status of the virtual SIM/subscriber added to the IoT SIM is either `active` or `terminated`.


            - `ready`

            - `active`

            - `inactive`

            - `standby`

            - `suspended`

            - `terminated`

            '
          enum:
          - ready
          - active
          - inactive
          - standby
          - suspended
          - terminated
          type: string
        tags:
          $ref: '#/components/schemas/TagSet'
        terminationEnabled:
          description: 'Value indicating whether the IoT SIM can be terminated (termination protection setting).


            - `true`: Can be terminated (termination protection OFF)

            - `false`: Cannot be terminated (termination protection ON)

            '
          type: boolean
        testmodeExhaustedTime:
          description: UNIX time (in milliseconds) when the SIM exceeded the testing usage limit.
          format: int64
          type: integer
        type:
          description: 'IoT SIM Type


            - `euicc`: Chip type (eSIM)

            - `uicc`: Card type

            - `virtual`: Virtual SIM/Subscriber

            '
          enum:
          - euicc
          - uicc
          - virtual
          type: string
      type: object
    ExpiryTime:
      properties:
        expiryAction:
          description: 'Action at expiration. Specify one of the following Please refer to [Soracom Air Expiration Function](https://developers.soracom.io/en/docs/air/expiration/) for more detail. You have to disable termination protection if you want to specify `terminate` as an action.


            If omitted, a null value is set.

            - `doNothing` : do nothing

            - `deleteSession` : delete session of the SIM if any

            - `deactivate` : change the SIM status to Inactive

            - `suspend` : change the SIM status to Suspended

            - `terminate` : forcibly end any existing connections, and terminate the SIM

            - null value : not set (It works the same as `doNothing`)

            '
          enum:
          - doNothing
          - deleteSession
          - deactivate
          - suspend
          - terminate
          - (null value)
          nullable: true
          type: string
        expiryTime:
          description: Timestamp of date and time set using the Expiration function (UNIX time in milliseconds)
          format: int64
          type: integer
      required:
      - expiryTime
      type: object
    DownlinkPingRequest:
      properties:
        numberOfPingRequests:
          default: 1
          description: The number of attempt ping.
          maximum: 5
          type: integer
        timeoutSeconds:
          default: 1
          description: The timeout duration of each ping.
          maximum: 3
          type: integer
      type: object
    SimDownlinkRtspCommandSnapshotOptions:
      properties:
        destinations:
          description: 'Storage destination for the snapshot image.

            '
          properties:
            harvestFiles:
              $ref: '#/components/schemas/SimDownlinkRtspCommandSnapshotHarvestFilesDestinationOptions'
              description: 'Storage destination for the snapshot image in SORACOM Harvest Files.

                '
          type: object
      type: object
    CreateSimRequest:
      properties:
        subscription:
          description: To create a virtual SIM/Subscriber, specify `planArc01`.
          enum:
          - planArc01
          type: string
        type:
          description: To create a virtual SIM/Subscriber, specify `virtual`.
          enum:
          - virtual
          type: string
      required:
      - type
      - subscription
      type: object
    Placement:
      properties:
        infrastructureProvider:
          enum:
          - aws
          type: string
        region:
          description: 'If `infrastructureProvider` is `aws`, it indicates the rendezvous point.



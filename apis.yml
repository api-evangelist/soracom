apis:
- aid: soracom:soracom-sim-api
  name: Soracom SIM Management API
  tags:
  - IoT
  - Cellular
  - SIM
  - Subscriber
  humanURL: https://users.soracom.io/ja-jp/tools/api/reference/#/Sim
  baseURL: https://api.soracom.io/v1
  properties:
  - url: https://developers.soracom.io/en/docs/air/
    type: Documentation
  - url: https://users.soracom.io/ja-jp/tools/api/reference/#/Sim
    type: Documentation
  - url: openapi/soracom-sim-api-openapi.yml
    type: OpenAPI
  - url: json-schema/soracom-sim-schema.json
    type: JSONSchema
  - url: json-structure/soracom-sim-structure.json
    type: JSONStructure
  - url: examples/soracom-sim-list-example.json
    type: Examples
  description: >-
    Manage Soracom Air for Cellular SIMs (and Subscribers) — list, get, create Arc virtual SIMs, activate/deactivate/suspend/terminate,
    set group binding, set IMEI lock, view session events, manage SIM profiles for multi-IMSI eSIM, and
    read cell-tower location info.
- aid: soracom:soracom-group-api
  name: Soracom Group Configuration API
  tags:
  - IoT
  - Group
  - Configuration
  tags_raw:
  - IoT
  - Groups
  - Configuration
  humanURL: https://users.soracom.io/ja-jp/tools/api/reference/#/Group
  baseURL: https://api.soracom.io/v1
  properties:
  - url: https://developers.soracom.io/en/docs/group-configuration/
    type: Documentation
  - url: openapi/soracom-group-api-openapi.yml
    type: OpenAPI
  - url: json-schema/soracom-group-schema.json
    type: JSONSchema
  description: >-
    Manage Soracom groups and per-service configuration. Groups bind SIMs and devices to namespaced configuration
    for SoracomAir, SoracomBeam, SoracomFunnel, SoracomFunk, SoracomHarvest, SoracomJunction, SoracomOrbit,
    and metadata services.
- aid: soracom:soracom-billing-api
  name: Soracom Billing API
  tags:
  - IoT
  - Billing
  - FinOps
  - Payment
  - Coupons
  - Order
  tags_raw:
  - IoT
  - Billing
  - FinOps
  - Payment
  - Coupons
  - Orders
  humanURL: https://users.soracom.io/ja-jp/tools/api/reference/#/Billing
